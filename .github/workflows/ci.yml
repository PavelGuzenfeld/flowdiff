name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgraph-easy-perl gdb
      - run: pip install -e .[dev]
      - run: pyright flowdiff
      - run: pytest -q
      - if: github.event_name == 'pull_request'
        run: python tools/mutation_gate.py --base origin/main --threshold 80
