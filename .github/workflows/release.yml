name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag must match pyproject.toml's version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $pyproject_version" >&2
            exit 1
          fi
      - run: pip install -e .[release]
      - run: python -m build
      - run: twine check dist/*
      # No publish step: that stays a deliberate, manual `twine upload dist/*` once these artifacts
      # have been reviewed. This job only proves a tagged commit builds a valid, installable package.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
